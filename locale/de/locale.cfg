[mod-name]
personal-equipment-fuel-manager=Persönlicher Ausrüstungs-Brennstoffmanager

[mod-description]
personal-equipment-fuel-manager=Verwaltet Brennstoff und verbrauchte Rückstände in persönlicher Brenner-Ausrüstung und warnt bei leerer oder blockierter Ausrüstung.

[shortcut-name]
personal-equipment-fuel-manager-toggle=Persönlichen Ausrüstungs-Brennstoffmanager ausführen

[shortcut-description]
personal-equipment-fuel-manager-toggle=Führt das Einfüllen von Brennstoff und Entnehmen verbrauchter Rückstände einmal aus oder schaltet bei entsprechender Einstellung den Dauerbetrieb um. Warnungen sind immer aktiv.

[mod-setting-name]
personal-equipment-fuel-manager-shortcut-behavior=Verhalten des Shortcuts

[mod-setting-description]
personal-equipment-fuel-manager-shortcut-behavior=Legt fest, ob ein Klick den Manager sofort einmal ausführt oder den regelmäßigen Hintergrundbetrieb ein- und ausschaltet. Beim Einschalten des Dauerbetriebs wird der Manager ebenfalls sofort ausgeführt.

[string-mod-setting]
personal-equipment-fuel-manager-shortcut-behavior-run-once=Einmal ausführen
personal-equipment-fuel-manager-shortcut-behavior-toggle-continuous=Dauerbetrieb umschalten

[virtual-signal-name]
personal-equipment-fuel-manager-alert=Warnung für Brennstoff in persönlicher Ausrüstung

[personal-equipment-fuel-manager-alert]
no-fuel=__1__ hat keinen Brennstoff.
spent-blocked=__1__ kann verbrauchte Rückstände nicht ausgeben.
no-fuel-and-spent-blocked=__1__ hat keinen Brennstoff und kann verbrauchte Rückstände nicht ausgeben.
