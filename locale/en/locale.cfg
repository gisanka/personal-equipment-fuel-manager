[mod-name]
personal-equipment-fuel-manager=Personal Equipment Fuel Manager

[mod-description]
personal-equipment-fuel-manager=Manages fuel and spent fuel in the player's personal burner equipment and warns about empty or blocked equipment.

[shortcut-name]
personal-equipment-fuel-manager-toggle=Run personal equipment fuel manager

[shortcut-description]
personal-equipment-fuel-manager-toggle=Runs fuel loading and spent-fuel unloading once, or toggles continuous operation when configured. Warnings are always active.

[mod-setting-name]
personal-equipment-fuel-manager-shortcut-behavior=Shortcut behavior

[mod-setting-description]
personal-equipment-fuel-manager-shortcut-behavior=Choose whether clicking the shortcut runs the manager once immediately or toggles continuous background operation.

[string-mod-setting]
personal-equipment-fuel-manager-shortcut-behavior-run-once=Run once
personal-equipment-fuel-manager-shortcut-behavior-toggle-continuous=Toggle continuous operation

[virtual-signal-name]
personal-equipment-fuel-manager-alert=Personal equipment fuel warning

[personal-equipment-fuel-manager-alert]
no-fuel=__1__ has no fuel.
spent-blocked=__1__ cannot output its spent fuel.
no-fuel-and-spent-blocked=__1__ has no fuel and cannot output its spent fuel.
